apiVersion: apps/v1
kind: Deployment
metadata: { name: dashboard, labels: { app: dashboard } }
spec:
  replicas: 2
  selector: { matchLabels: { app: dashboard } }
  template:
    metadata: { labels: { app: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/OWNER/web-crawler-pro/dashboard:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata: { name: dashboard }
spec:
  selector: { app: dashboard }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: dashboard }
spec:
  rules:
    - host: crawler.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard, port: { number: 80 } } }
