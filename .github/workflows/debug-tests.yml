name: debug-tests

# TEMPORARY: mirrors .github/workflows/ci.yml but re-emits the pytest output as
# ::error:: annotations so the failure can be read back through the checks API
# (log downloads are not reachable from the dev sandbox). Delete before merge.

on:
  push:
    branches: [arena/5f1fb007-web-crawler-pro]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest fakeredis[lua] ruff
      - name: Unit tests (annotated)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          pytest -q --tb=short -rf > pytest.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "PYTEST EXIT: $code" > annotate.txt
            tail -n 90 pytest.log >> annotate.txt
          else
            echo "ALL TESTS PASSED" > annotate.txt
          fi
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < annotate.txt
          fi
          cat annotate.txt
          exit "$code"
