name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the optional native tokeniser
        # Plain C, no Python headers needed. If the runner ever loses its
        # compiler the step exits 0 and the tests fall back to the Python path.
        run: ./scripts/build-native.sh
      - name: Tokeniser equivalence + benchmark
        run: python scripts/bench-tokenizer.py
      - name: Lint (ruff)
        run: ruff check src workers tests || true
      - name: Unit tests
        run: pytest -q
        env:
          REDIS_URL: redis://localhost:6379/0

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/package-lock.json
      - name: Install SDK workspace dependencies
        working-directory: sdks
        run: npm ci
      - name: Build and test all SDK packages
        working-directory: sdks
        run: npm test --workspaces --if-present
      - name: Verify packages can be packed
        working-directory: sdks
        run: |
          npm pack --workspace @webintelligence/sdk --dry-run
          npm pack --workspace @webintelligence/mcp-server --dry-run

  container-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [worker, dashboard, crawler, worker-stealth]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.target }}

  compose-smoke:
    if: github.event_name == 'pull_request'
    needs: [test, container-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start dashboard and Redis from Compose
        run: docker compose up --build -d redis dashboard
      - name: Wait for dashboard health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs dashboard
          exit 1
      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [worker, dashboard, crawler, worker-stealth]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image repository
        id: image
        # GHCR rejects repository names containing uppercase, and this
        # repository's owner (QuamLepus) does — the build failed with
        # `invalid tag ...: repository name must be lowercase` before it ever
        # reached the Dockerfile.
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}/${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
