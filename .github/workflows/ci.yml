name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the optional native tokeniser
        # Plain C, no Python headers needed. If the runner ever loses its
        # compiler the step exits 0 and the tests fall back to the Python path.
        run: ./scripts/build-native.sh
      - name: Tokeniser equivalence + benchmark
        run: python scripts/bench-tokenizer.py
      - name: Lint (ruff)
        run: ruff check src workers tests || true
      - name: Unit tests
        run: pytest -q
        env:
          REDIS_URL: redis://localhost:6379/0

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/package-lock.json
      - name: Install SDK workspace dependencies
        working-directory: sdks
        run: npm ci
      - name: Build and test all SDK packages
        working-directory: sdks
        run: npm test --workspaces --if-present
      - name: Verify packages can be packed
        working-directory: sdks
        run: |
          npm pack --workspace @webintelligence/sdk --dry-run
          npm pack --workspace @webintelligence/mcp-server --dry-run

  container-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [worker, dashboard, crawler, worker-stealth]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: wcp-${{ matrix.target }}:validation
          load: true
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.target }}
      - name: Report built image virtual size
        run: python scripts/report-image-sizes.py "wcp-${{ matrix.target }}:validation"

  compose-smoke:
    if: github.event_name == 'pull_request'
    needs: [test, container-build]
    runs-on: ubuntu-latest
    env:
      WCP_IMAGE_TAG: validation-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          WCP_IMAGE_TAG: validation-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet
      - name: Build and start dashboard and Redis through the GHCR Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up --build -d redis dashboard
      - name: Wait for dashboard health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml logs dashboard
          exit 1
      - name: Stop Compose services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml down --volumes --remove-orphans

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [worker, dashboard, crawler, worker-stealth]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image repository
        id: image
        # GHCR rejects repository names containing uppercase, and this
        # repository's owner (QuamLepus) does — the build failed with
        # `invalid tag ...: repository name must be lowercase` before it ever
        # reached the Dockerfile.
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}/${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  published-compose-smoke:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the published commit-SHA images
        run: echo "WCP_IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Pull all published application images
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull worker worker-stealth crawler dashboard
      - name: Report published image virtual sizes
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          python scripts/report-image-sizes.py \
            "$repo/worker:${GITHUB_SHA}" \
            "$repo/worker-stealth:${GITHUB_SHA}" \
            "$repo/crawler:${GITHUB_SHA}" \
            "$repo/dashboard:${GITHUB_SHA}"
      - name: Start dashboard, Redis, and published workers
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up --no-build -d redis dashboard worker worker-stealth
      - name: Wait for published dashboard health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml logs dashboard
          exit 1
      - name: Wait for published Celery workers to become ready
        run: |
          compose=(docker compose -f docker-compose.yml -f docker-compose.ghcr.yml)
          for service in worker worker-stealth; do
            ready=false
            for attempt in $(seq 1 45); do
              if "${compose[@]}" logs --no-color "$service" | grep -qE 'ready\.'; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              "${compose[@]}" logs --no-color "$service"
              exit 1
            fi
          done
      - name: Stop Compose services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml down --volumes --remove-orphans
