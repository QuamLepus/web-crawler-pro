name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the optional native tokeniser
        # Plain C, no Python headers needed. If the runner ever loses its
        # compiler the step exits 0 and the tests fall back to the Python path.
        run: ./scripts/build-native.sh
      - name: Tokeniser equivalence + benchmark
        run: python scripts/bench-tokenizer.py
      - name: Lint (ruff)
        run: ruff check src workers tests || true
      - name: Unit tests
        run: pytest -q
        env:
          REDIS_URL: redis://localhost:6379/0

  stripe-test-mode:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - name: Check Stripe test-mode secrets
        id: stripe-secrets
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
        run: |
          if [[ -z "$STRIPE_TEST_SECRET_KEY" && -z "$STRIPE_TEST_PRICE_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stripe integration skipped; configure STRIPE_TEST_SECRET_KEY and STRIPE_TEST_PRICE_ID Actions secrets."
          elif [[ -z "$STRIPE_TEST_SECRET_KEY" || -z "$STRIPE_TEST_PRICE_ID" ]]; then
            echo "::error::Both Stripe test-mode secrets must be configured."
            exit 1
          elif [[ "$STRIPE_TEST_SECRET_KEY" != sk_test_* ]]; then
            echo "::error::Refusing a non-test Stripe secret key."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.stripe-secrets.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        if: steps.stripe-secrets.outputs.enabled == 'true'
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-go@v5
        if: steps.stripe-secrets.outputs.enabled == 'true'
        with:
          go-version: "1.24.x"
      - name: Install pinned Stripe CLI
        if: steps.stripe-secrets.outputs.enabled == 'true'
        env:
          GOBIN: ${{ runner.temp }}/stripe-cli-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/stripe/stripe-cli/cmd/stripe@v1.54.0
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/stripe" version
      - name: Create and verify a real test-mode Checkout Session
        if: steps.stripe-secrets.outputs.enabled == 'true'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
        run: pytest -q -m stripe_integration tests/test_stripe_integration.py
      - name: Deliver a Stripe CLI-signed test event over HTTP
        if: steps.stripe-secrets.outputs.enabled == 'true'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/stripe-cli-delivery-smoke.py

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/package-lock.json
      - name: Install SDK workspace dependencies
        working-directory: sdks
        run: npm ci
      - name: Build and test all SDK packages
        working-directory: sdks
        run: npm test --workspaces --if-present
      - name: Verify packages can be packed
        working-directory: sdks
        run: |
          npm pack --workspace @webintelligence/sdk --dry-run
          npm pack --workspace @webintelligence/mcp-server --dry-run

  container-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [worker, dashboard, crawler, worker-stealth]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: wcp-${{ matrix.target }}:validation
          load: true
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.target }}
      - name: Report built image virtual size
        run: python scripts/report-image-sizes.py "wcp-${{ matrix.target }}:validation" | tee image-sizes.tsv
      - name: Archive built image size report
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-size-${{ matrix.target }}
          path: image-sizes.tsv
          if-no-files-found: error
          retention-days: 30

  compose-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [test, container-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WCP_IMAGE_TAG: validation-only
    steps:
      - uses: actions/checkout@v4
      - name: Configure Elasticsearch host setting
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Validate Compose configuration
        env:
          WCP_IMAGE_TAG: validation-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet
      - name: Build core application images through the GHCR overlay
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml build worker worker-stealth dashboard
      - name: Pull Redis image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull redis
      - name: Pull PostgreSQL image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull postgres
      - name: Authenticate to Quay for MinIO when credentials are configured
        id: quay-auth
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -n "$QUAY_USERNAME" && -n "$QUAY_PASSWORD" ]]; then
            printf '%s' "$QUAY_PASSWORD" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin
            echo "minio_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "minio_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MinIO smoke skipped: configure QUAY_USERNAME and QUAY_PASSWORD repository secrets."
          fi
      - name: Pull MinIO image
        if: steps.quay-auth.outputs.minio_enabled == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull minio
      - name: Pull Elasticsearch image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull elasticsearch
      - name: Pull Prometheus image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull prometheus
      - name: Start core backing services
        env:
          MINIO_ENABLED: ${{ steps.quay-auth.outputs.minio_enabled }}
        run: |
          services=(redis postgres elasticsearch prometheus)
          if [[ "$MINIO_ENABLED" == "true" ]]; then services+=(minio); fi
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d "${services[@]}"
      - name: Start the core application services
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up --no-build -d worker worker-stealth beat dashboard
      - name: Check core Compose services
        env:
          WCP_GHCR_OVERLAY: "1"
          WCP_SKIP_MINIO: ${{ steps.quay-auth.outputs.minio_enabled != 'true' }}
        run: bash scripts/compose-smoke-check.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml logs --no-color
      - name: Stop Compose services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml down --volumes --remove-orphans

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [worker, dashboard, crawler, worker-stealth]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image repository
        id: image
        # GHCR rejects repository names containing uppercase, and this
        # repository's owner (QuamLepus) does — the build failed with
        # `invalid tag ...: repository name must be lowercase` before it ever
        # reached the Dockerfile.
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}/${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  published-compose-smoke:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the published commit-SHA images
        run: |
          echo "WCP_IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WCP_GHCR_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Pull all published application images
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull worker worker-stealth crawler dashboard
      - name: Report published image virtual sizes
        run: |
          repo="$WCP_GHCR_REPO"
          python scripts/report-image-sizes.py \
            "$repo/worker:${GITHUB_SHA}" \
            "$repo/worker-stealth:${GITHUB_SHA}" \
            "$repo/crawler:${GITHUB_SHA}" \
            "$repo/dashboard:${GITHUB_SHA}" | tee image-sizes.tsv
      - name: Archive published image size report
        uses: actions/upload-artifact@v4
        with:
          name: published-docker-image-sizes
          path: image-sizes.tsv
          if-no-files-found: error
          retention-days: 90
      - name: Configure Elasticsearch host setting
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Pull Redis image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull redis
      - name: Pull PostgreSQL image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull postgres
      - name: Authenticate to Quay for MinIO when credentials are configured
        id: quay-auth
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -n "$QUAY_USERNAME" && -n "$QUAY_PASSWORD" ]]; then
            printf '%s' "$QUAY_PASSWORD" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin
            echo "minio_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "minio_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MinIO smoke skipped: configure QUAY_USERNAME and QUAY_PASSWORD repository secrets."
          fi
      - name: Pull MinIO image
        if: steps.quay-auth.outputs.minio_enabled == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull minio
      - name: Pull Elasticsearch image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull elasticsearch
      - name: Pull Prometheus image
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull prometheus
      - name: Start published core backing services
        env:
          MINIO_ENABLED: ${{ steps.quay-auth.outputs.minio_enabled }}
        run: |
          services=(redis postgres elasticsearch prometheus)
          if [[ "$MINIO_ENABLED" == "true" ]]; then services+=(minio); fi
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d "${services[@]}"
      - name: Start the published core application services
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up --no-build -d worker worker-stealth beat dashboard
      - name: Check published core Compose services
        env:
          WCP_GHCR_OVERLAY: "1"
          WCP_SKIP_MINIO: ${{ steps.quay-auth.outputs.minio_enabled != 'true' }}
        run: bash scripts/compose-smoke-check.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml logs --no-color
      - name: Stop Compose services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml down --volumes --remove-orphans
